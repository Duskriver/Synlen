[package]
name = "synlen_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
once_cell = "1"
parking_lot = "0.12"
rc-zip = { version = "5", features = ["deflate"] }
positioned-io = "0.3"
sha1 = "0.11.0"
quick-xml = "0.37"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
