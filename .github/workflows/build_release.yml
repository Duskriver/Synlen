name: Build And Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.3.0），手动触发时必填，用于派生 versionCode'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # 发布前置质量门禁：测试不过不构建产物。
  quality-gates:
    name: Quality Gates (analyze · test · layer · rust · assets drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Run layer gates
        run: dart run tool/layer_gates.dart

      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml

      - name: Run documentation gates
        run: dart run tool/doc_gates.dart

      - name: Install web toolchain
        working-directory: web_assets/controller.js
        run: npm ci

      - name: Typecheck reader TypeScript
        working-directory: web_assets/controller.js
        run: npm run typecheck

      - name: Detect generated assets drift
        run: |
          dart run tool/build_web_assets.dart
          git diff --exit-code lib/src/web/web_assets.dart

  build-android:
    name: Build Android APKs & AAB
    needs: [quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # OSS 凭据经 env 中转：GitHub 禁止在 if 条件里直接引用 secrets 上下文，
    # 而 job 级 env 在 step 级 if 中可见，用它判空才能保住整个 workflow 有效。
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Compute Build Number
        id: build_number
        run: |
          # versionCode 从 tag 派生（vX.Y.Z → X*10000+Y*100+Z），
          # 保证每次发版递增，覆盖安装不会被拒
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          TAG="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          echo "value=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Create Output Dir
        run: mkdir -p build/outputs

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-number=${{ steps.build_number.outputs.value }}
          
          NEW_NAME="synlen-${{ github.ref_name }}-bundle-release.aab"
          
          mv build/app/outputs/bundle/release/app-release.aab build/outputs/$NEW_NAME
          echo "Generated $NEW_NAME"

      - name: Build Universal APK
        run: |
          flutter build apk --release \
            --build-number=${{ steps.build_number.outputs.value }}
          
          NEW_NAME="synlen-${{ github.ref_name }}-universal-release.apk"
          
          mv build/app/outputs/flutter-apk/app-release.apk build/outputs/$NEW_NAME
          echo "Generated $NEW_NAME"

      - name: Build Split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ steps.build_number.outputs.value }}
          
          cd build/app/outputs/flutter-apk/
          for file in app-*-release.apk; do
            abi=${file#app-}
            abi=${abi%-release.apk}
            
            NEW_NAME="synlen-${{ github.ref_name }}-$abi-release.apk"
            
            mv "$file" "${{ github.workspace }}/build/outputs/$NEW_NAME"
            echo "Generated $NEW_NAME"
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-artifacts
          path: build/outputs/*

      # 可选：上传到阿里云 OSS（国内分发源）。
      # 配置 GitHub Secrets（OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / OSS_BUCKET / OSS_REGION）后自动生效；
      # 开源后 fork 拿不到 secrets，天然安全。未配置则跳过。
      - name: Upload to Aliyun OSS (optional)
        if: startsWith(github.ref, 'refs/tags/') && env.OSS_ACCESS_KEY_ID != '' && env.OSS_ACCESS_KEY_SECRET != ''
        run: |
          # 安装 ossutil v1
          curl -sL -o /tmp/ossutil.zip "https://gosspublic.alicdn.com/ossutil/ossutil-1.7.19-linux-amd64.zip"
          unzip -o -q /tmp/ossutil.zip -d /tmp/ossutil-bin
          chmod +x /tmp/ossutil-bin/ossutil
          export PATH="/tmp/ossutil-bin:$PATH"
          # 复用发布脚本：生成 version.json 并上传 APK
          bash tool/upload_release.sh "${{ github.ref_name }}" "${{ secrets.OSS_BUCKET }}" "${{ secrets.OSS_REGION }}"

  build-ios:
    name: Build iOS IPA
    needs: [quality-gates]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Get Dependencies
        run: flutter pub get

      - name: Compute Build Number
        id: build_number
        run: |
          # 与 Android 侧同规则派生 CFBundleVersion，保持双端一致
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          TAG="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          echo "value=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Build IPA (Unsigned)
        run: flutter build ios --release --no-codesign \
            --build-number=${{ steps.build_number.outputs.value }}

      - name: Package into IPA
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/

          NAME="synlen-${{ github.ref_name }}-ios-unsigned.ipa"
          zip -r $NAME Payload
          echo "Generated $NAME"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-artifacts
          path: synlen-${{ github.ref_name }}-ios-unsigned.ipa

  create-release:
    name: Create GitHub Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download iOS Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-artifacts
          path: artifacts
          
      - name: Download Android Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-artifacts
          path: artifacts

      - name: Extract Release Notes
        id: extract_notes
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3

      - name: Release to GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
          body: ${{ steps.extract_notes.outputs.release_notes }}
          generate_release_notes: false
          prerelease: false
