name: Flutter CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  flutter:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Flutter 版本固定为本地验证过的 stable，升级需单独验证后再改
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # lock 必须等于当前 Flutter 版本下的解析结果。Dependabot 的解析环境看不到
      # Flutter SDK 的钉版（flutter_localizations / flutter_test），会把 SDK 不
      # 允许的版本写进 lock，而 pub get 会静默重新解析，测试照常通过——破损只在
      # 本地工作区变脏、以及 release.sh 要求干净工作区时才暴露。
      - name: Check pubspec.lock drift
        run: |
          if ! git diff --exit-code -- pubspec.lock; then
            echo '::error::pubspec.lock 与当前 Flutter 版本的解析结果不一致；请用 CI 固定的 Flutter 版本重跑 flutter pub get 并提交结果。'
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Run layer gates
        run: dart run tool/layer_gates.dart

  android-reader:
    name: Readium Android native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      # universal 缓存含 wrapper；pub get 生成本机配置与插件清单，不构建 APK。
      - name: Prepare Android project
        run: |
          flutter precache --universal
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Run native reader regressions
        run: bash tool/test_readium_android.sh

  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # doc_gates 是纯 Dart 脚本，用 setup-dart 即可；Dart 版本与 Flutter 3.44.9 自带 Dart 锁步，flutter-version 升级时同步改
      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.12.2'

      # 链接 / 锚点 / 术语 / Agent Note 格式 / 技能元数据 / 预算 / Markdown 卫生
      - name: Run documentation gates
        run: dart tool/doc_gates.dart

  web-assets:
    name: Reader lock · typecheck · Playwright tests · assets drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 构建学习脚本只需 Dart；版本与 Flutter 自带 Dart 锁步。
      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.12.2'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # 安装 lockfile 锁定的 typescript / esbuild（构建脚本使用本地 .bin/esbuild）
      - name: Install web toolchain
        working-directory: web_assets/readium
        run: npm ci

      - name: Check reader package lock drift
        run: git diff --exit-code -- web_assets/readium/package-lock.json

      - name: Typecheck reader TypeScript
        working-directory: web_assets/readium
        run: npm run typecheck

      # 浏览器集与 playwright.config.cjs 的 projects 保持一致：chromium + webkit
      - name: Install Playwright browsers
        working-directory: web_assets/readium
        run: |
          # runner 镜像预置的 google-chrome apt 源偶发索引哈希不匹配，会让
          # --with-deps 里的 apt-get update 直接失败；Playwright 自带浏览器构建，
          # 不需要系统 Chrome，先移除该源
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources
          npx playwright install --with-deps chromium webkit

      - name: Run reader Playwright tests
        working-directory: web_assets/readium
        run: npm test

      # 学习脚本源码与 Flutter 加载的生成资产必须同步提交。
      - name: Detect generated assets drift
        run: |
          dart tool/build_readium_assets.dart
          git diff --exit-code -- assets/reader/readium_learning.js

  rust:
    name: Rust compile & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml
