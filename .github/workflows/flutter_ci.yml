name: Flutter CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  flutter:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Flutter 版本固定为本地验证过的 stable，升级需单独验证后再改
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Run layer gates
        run: dart run tool/layer_gates.dart

  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # doc_gates 是纯 Dart 脚本，用 setup-dart 即可；Dart 版本与 Flutter 3.44.9 自带 Dart 锁步，flutter-version 升级时同步改
      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.12.2'

      # 链接 / 锚点 / 术语 / Agent Note 格式 / 技能元数据 / 预算 / Markdown 卫生
      - name: Run documentation gates
        run: dart tool/doc_gates.dart

  web-assets:
    name: Reader typecheck · Playwright tests · assets drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build_web_assets 是纯 Dart 脚本，用 setup-dart 即可；Dart 版本与 Flutter 3.44.9 自带 Dart 锁步，flutter-version 升级时同步改
      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.12.2'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # 安装 lockfile 锁定的 typescript / esbuild（构建脚本使用本地 .bin/esbuild）
      - name: Install web toolchain
        working-directory: web_assets/controller.js
        run: npm ci

      - name: Typecheck reader TypeScript
        working-directory: web_assets/controller.js
        run: npm run typecheck

      # 浏览器集与 playwright.config.cjs 的 projects 保持一致：chromium + webkit
      - name: Install Playwright browsers
        working-directory: web_assets/controller.js
        run: |
          # runner 镜像预置的 google-chrome apt 源偶发索引哈希不匹配，会让
          # --with-deps 里的 apt-get update 直接失败；Playwright 自带浏览器构建，
          # 不需要系统 Chrome，先移除该源
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources
          npx playwright install --with-deps chromium webkit

      - name: Run reader Playwright tests
        working-directory: web_assets/controller.js
        run: npm test

      # 重新生成 web_assets.dart 并检测漂移：TS/CSS 源码改动必须同步生成物
      - name: Detect generated assets drift
        run: |
          dart tool/build_web_assets.dart
          git diff --exit-code lib/src/web/web_assets.dart

  rust:
    name: Rust compile & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml
