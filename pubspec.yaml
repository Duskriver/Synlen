name: synlen
description: "Synlen Reader - A lightweight, cross-platform EPUB reader built with Flutter, supporting iOS and Android systems."
publish_to: 'none'
homepage: https://github.com/Duskriver/Synlen

version: 0.2.3+1

environment:
  sdk: ^3.10.8
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  # 注：Flutter 3.44 生态锁（test_api 0.7.11）上限为 analyzer 12，
  # riverpod generator 4.0.6+ / drift_dev 2.34.5+ 均需 analyzer 13，待 Flutter 升级后解锁
  flutter_riverpod: ^3.3.2
  riverpod_annotation: 4.0.3

  # Navigation
  go_router: ^17.4.0

  # Database
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  collection: ^1.19.1

  # Storage
  shared_preferences: ^2.5.4

  # Functional Programming
  fpdart: ^1.2.0

  # EPUB Parsing
  xml: ^7.0.1
  archive: ^4.0.7
  crypto: ^3.0.7
  
  # Reader
  flutter_inappwebview: ^6.1.5
  flutter_widget_from_html_core: ^0.17.2
  wakelock_plus: ^1.7.0

  # File Picking & Permissions
  path: ^1.9.1
  
  # App Info & URL Launcher
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0

  # Image Compression
  flutter_image_compress: ^2.5.1
  saf_stream: ^4.0.1
  android_intent_plus: ^6.1.0

  # File Sharing (iOS Share Sheet)
  share_plus: ^13.3.0

  # Rust FFI bridge
  flutter_rust_bridge: 2.12.0
  synlen_rust:
    path: rust_builder
  
  # Network
  dio: ^5.11.0

  # Audio
  flutter_sound: ^9.30.0
  logger: ^2.7.0
  #flutter_markdown: ^0.7.7+1
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0
  meta: ^1.18.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  
  # Code Generation
  build_runner: ^2.15.1
  riverpod_generator: 4.0.4
  drift_dev: ^2.34.0
  
  # Testing
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  mockito: ^5.4.4

  # Icon
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/licenses/lumina_mit.txt
    - assets/icons/icon.svg
    - assets/logos/logo.svg

